<!DOCTYPE HTML>
<html>
<head>
	<title>Footwear - Cart</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Rokkitt:100,300,400,700" rel="stylesheet">

	<link rel="stylesheet" href="css/animate.css">
	<link rel="stylesheet" href="css/icomoon.css">
	<link rel="stylesheet" href="css/ionicons.min.css">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/magnific-popup.css">
	<link rel="stylesheet" href="css/flexslider.css">
	<link rel="stylesheet" href="css/owl.carousel.min.css">
	<link rel="stylesheet" href="css/owl.theme.default.min.css">
	<link rel="stylesheet" href="css/bootstrap-datepicker.css">
	<link rel="stylesheet" href="fonts/flaticon/font/flaticon.css">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- LOADER -->
<div class="colorlib-loader"></div>

<div id="page">

	<!-- NAV -->
	<nav class="colorlib-nav">

		<div class="top-menu">
			<div class="container">

				<div class="row">

					<div class="col-sm-7 col-md-9">
						<div id="colorlib-logo">
							<a href="index.html">Footwear</a>
						</div>
					</div>

					<div class="col-sm-5 col-md-3">
						<form class="search-wrap">
							<div class="form-group">
								<input type="search" class="form-control search" placeholder="Search">
								<button class="btn btn-primary submit-search" type="submit">
									<i class="icon-search"></i>
								</button>
							</div>
						</form>
					</div>

				</div>

				<div class="row">

					<div class="col-sm-12 menu-1">
						<ul>

							<li><a href="index.html">Home</a></li>
							<li><a href="men.html">Men</a></li>
							<li><a href="women.html">Women</a></li>

							<li class="cart">
								<a href="cart.html">
									<i class="icon-shopping-cart"></i>
									Cart [<span id="cart-count">0</span>]
								</a>
							</li>

						</ul>
					</div>

				</div>

			</div>
		</div>
	</nav>

	<!-- BREADCRUMBS -->
	<div class="breadcrumbs">
		<div class="container">
			<p class="bread">Home / Cart</p>
		</div>
	</div>

	<!-- CART SECTION -->
	<div class="colorlib-product">
		<div class="container">

			<div class="row row-pb-lg">
				<div class="col-md-12">

					<!-- HEADER -->
					<div class="product-name d-flex">
						<div class="one-forth text-left px-4"><span>Product</span></div>
						<div class="one-eight text-center"><span>Price</span></div>
						<div class="one-eight text-center"><span>Qty</span></div>
						<div class="one-eight text-center"><span>Total</span></div>
						<div class="one-eight text-center"><span>Remove</span></div>
					</div>

					<!-- ITEMS -->
					<div id="cart-items"></div>

				</div>
			</div>

			<!-- TOTAL -->
			<div class="row">
				<div class="col-md-12">

					<div class="total-wrap">
						<div class="row">

							<div class="col-sm-4 offset-sm-8 text-center">

								<div class="total">

									<p>Subtotal: <span id="subtotal">$0</span></p>
									<p>Delivery: $0</p>
									<p>Discount: $0</p>

									<hr>

									<h3>Total: <span id="grand-total">$0</span></h3>

								</div>

							</div>

						</div>
					</div>

				</div>
			</div>

		</div>
	</div>

	<!-- FOOTER -->
	<footer id="colorlib-footer"></footer>

</div>

<!-- JS -->
<script src="js/jquery.min.js"></script>
<script src="js/bootstrap.min.js"></script>

<script src="js/products.js"></script>
<script src="js/jquery.min.js"></script>
<script src="js/bootstrap.min.js"></script>

<script>

	function getCart() {
		try {
			return JSON.parse(localStorage.getItem("cart")) || [];
		} catch (e) {
			return [];
		}
	}

	function saveCart(cart) {
		localStorage.setItem("cart", JSON.stringify(cart));
	}

	/* ✅ FIND PRODUCT FROM PRODUCTS.JS */
	function getProduct(id) {
		return PRODUCTS.find(p => p.id === id);
	}

	/* CART COUNT */
	function updateCartCount() {
		let cart = getCart();
		let count = cart.reduce((sum, item) => sum + item.quantity, 0);

		let el = document.getElementById("cart-count");
		if (el) el.innerText = count;
	}

	/* RENDER CART */
	function renderCart() {

		let container = document.getElementById("cart-items");
		if (!container) return;

		let cart = getCart();
		let html = "";
		let subtotal = 0;

		if (cart.length === 0) {
			container.innerHTML = "<h3 style='text-align:center;padding:40px;'>Your cart is empty</h3>";
			updateCartCount();
			return;
		}

		cart.forEach((item, index) => {

			let product = getProduct(item.id);

			if (!product) return; // prevents undefined crash

			let price = product.price;
			let total = price * item.quantity;
			subtotal += total;

			html += `
        <div class="product-cart d-flex">

            <div class="one-forth">
                <div class="product-img" style="background-image:url(${product.image})"></div>
                <h3>${product.name}</h3>
            </div>

            <div class="one-eight text-center">
                <span>$${price}</span>
            </div>

            <div class="one-eight text-center">
                <input type="number"
                       value="${item.quantity}"
                       min="1"
                       onchange="updateQty('${item.id}', this.value)">
            </div>

            <div class="one-eight text-center">
                <span>$${total}</span>
            </div>

            <div class="one-eight text-center">
                <a href="#" onclick="removeItem('${item.id}')">X</a>
            </div>

        </div>
        `;
		});

		container.innerHTML = html;

		document.getElementById("subtotal").innerText = "Pkr" + subtotal;
		document.getElementById("grand-total").innerText = "Pkr " + subtotal;

		updateCartCount();
	}

	/* UPDATE QTY (FIXED BY ID) */
	function updateQty(id, qty) {

		let cart = getCart();

		cart = cart.map(item => {
			if (item.id === id) {
				return { ...item, quantity: parseInt(qty) };
			}
			return item;
		});

		saveCart(cart);
		renderCart();
	}

	/* REMOVE ITEM (FIXED BY ID) */
	function removeItem(id) {

		let cart = getCart();
		cart = cart.filter(item => item.id !== id);

		saveCart(cart);
		renderCart();
	}

	/* INIT */
	document.addEventListener("DOMContentLoaded", function () {
		renderCart();
		updateCartCount();
	});

	/* LOADER FIX */
	window.addEventListener("load", function () {
		let loader = document.querySelector(".colorlib-loader");
		if (loader) loader.style.display = "none";
	});

</script>

</body>
</html>
